name: Update generated code

on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * 6'

defaults:
  run:
    shell: bash

jobs:
  lints-gen:
    if: ${{ github.repository == 'rust-lang/rust-analyzer' || github.event_name == 'workflow_dispatch' }}
    name: Generate lints
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly
        run: rustup default nightly

      - name: Generate lints/feature flags
        run: cargo codegen lint-definitions

      - name: Generate target feature implications
        run: cargo codegen target-features

      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Submit PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "internal: update generated lints and target features"
          branch: "ci/gen-sync"
          delete-branch: true
          sign-commits: true
          title: "Update generated lints and target features"
          body: "Weekly lint updates for `crates/ide-db/src/generated/lints.rs` and `crates/hir-ty/src/generated/target_features.rs`."
          labels: "A-infra"
